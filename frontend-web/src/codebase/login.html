<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In / Sign Up - Mototrad</title>
    <meta name="description" content="Log in or create an account on Mototrad.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--bg-light);
        }
        
        .auth-container {
            display: flex;
            height: 100vh;
        }

        /* Left Side: Image */
        .auth-image-side {
            flex: 1;
            background-image: url('hero_auction_bg.png');
            background-size: cover;
            background-position: center;
            position: relative;
            display: none;
        }
        
        @media (min-width: 992px) {
            .auth-image-side {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }

        .auth-image-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(211,47,47,0.4) 100%);
            z-index: 1;
        }

        .auth-image-content {
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        .auth-image-content h2 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .auth-image-content p {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            font-weight: 300;
        }

        /* Right Side: Form */
        .auth-form-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: var(--bg-white);
            overflow-y: auto;
        }

        .auth-form-container {
            width: 100%;
            max-width: 450px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .auth-logo img {
            height: 40px;
            margin-bottom: 10px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 10px;
        }
        .auth-header p {
            color: var(--text-gray);
            font-size: 1rem;
        }

        /* Social Login */
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: white;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }
        .btn-social:hover {
            background-color: var(--bg-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .btn-social img {
            height: 20px;
            width: 20px;
        }
        .btn-social i {
            font-size: 1.2rem;
        }
        .fa-google { color: #DB4437; }
        .fa-apple { color: #000000; }
        .fa-facebook { color: #1877F2; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--text-gray);
            font-size: 0.9rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .divider:not(:empty)::before {
            margin-right: .25em;
        }
        .divider:not(:empty)::after {
            margin-left: .25em;
        }

        /* Standard Form */
        .auth-form .form-group {
            margin-bottom: 20px;
        }
        .auth-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.9rem;
        }
        .auth-form input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            background-color: var(--bg-light);
            transition: all 0.3s;
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(211,47,47,0.1);
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .auth-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            font-weight: 500;
            margin: 0;
        }
        .forgot-password {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: var(--radius-md);
        }

        .auth-footer {
            text-align: center;
            margin-top: 30px;
            color: var(--text-gray);
            font-size: 0.95rem;
        }
        .auth-footer a {
            color: var(--primary-color);
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 20px;
            right: 30px;
            color: var(--text-gray);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Left Side -->
        <div class="auth-image-side">
            <div class="auth-image-overlay"></div>
            <div class="auth-image-content">
                <h2>Welcome to Mototrad</h2>
                <p>Join the world's most exclusive platform for premium vintage vehicles, luxury timepieces, and fine assets.</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-form-side">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
            
            <div class="auth-form-container">
                <div class="auth-logo">
                    <a href="index.html">
                        <img src="https://mototrad.com/assets/dist/img/mototrad-logo-cropped.jpg" alt="Mototrad Logo">
                    </a>
                </div>

                <div class="auth-header">
                    <h1>Sign In</h1>
                    <p>Enter your details to access your account</p>
                </div>

                <div class="social-login">
                    <button class="btn-social">
                        <i class="fab fa-google"></i> Continue with Google
                    </button>
                    <button class="btn-social">
                        <i class="fab fa-apple"></i> Continue with Apple
                    </button>
                    <button class="btn-social">
                        <i class="fab fa-facebook"></i> Continue with Facebook
                    </button>
                </div>

                <div class="divider">or sign in with email</div>

                <form class="auth-form" action="index.html">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="auth-options">
                        <label>
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-submit">Sign In</button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="#">Sign up here</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
